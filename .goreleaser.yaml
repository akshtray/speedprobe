# Release pipeline. A pushed tag matching v* runs .github/workflows/release.yml,
# which invokes `goreleaser release`. Every PR runs `goreleaser release
# --snapshot` so a broken config is caught before a tag exists.
version: 2
project_name: speedprobe

git:
  # The Python prototype is tagged outside semver; releases start at v0.2.0.
  ignore_tags:
    - python-v0.1.0

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/speedprobe
    binary: speedprobe
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"
    goos: [linux, darwin, windows, freebsd]
    goarch: [amd64, arm64, arm]
    goarm: ["7"]
    ignore:
      - { goos: darwin, goarch: arm }
      - { goos: windows, goarch: arm }
      - { goos: freebsd, goarch: arm }
      - { goos: freebsd, goarch: arm64 }

# Asset names carry no version so that GitHub's permanent alias
#   https://github.com/akshtray/speedprobe/releases/latest/download/<name>
# always points at the newest release. Versioned URLs keep working under
# releases/download/vX.Y.Z/, and the version is inside every package.
archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    format_overrides:
      - goos: windows
        formats: [zip]
    files: [LICENSE, README.md]

checksum:
  name_template: checksums.txt

# Keyless signing of the checksums file via Sigstore. Verify with:
#   cosign verify-blob --certificate checksums.txt.pem --signature checksums.txt.sig \
#     --certificate-identity-regexp 'github.com/akshtray/speedprobe' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com checksums.txt
signs:
  - cmd: cosign
    certificate: "${artifact}.pem"
    args:
      - sign-blob
      - "--output-certificate=${certificate}"
      - "--output-signature=${signature}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum

nfpms:
  - package_name: speedprobe
    vendor: akshtray
    homepage: https://github.com/akshtray/speedprobe
    maintainer: akshtray <akshtray@users.noreply.github.com>
    description: Multi-provider internet speed test CLI and TUI
    license: MIT
    formats: [deb, rpm]
    file_name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    bindir: /usr/bin
    section: net

# Homebrew tap, for macOS and Linux (Linuxbrew installs casks too). The
# binary is not notarized (see the design notes), so the hook clears the
# quarantine flag that Gatekeeper would otherwise trip on.
homebrew_casks:
  - name: speedprobe
    repository:
      owner: akshtray
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    homepage: https://github.com/akshtray/speedprobe
    description: Multi-provider internet speed test CLI and TUI
    license: MIT
    binaries: [speedprobe]
    # Homebrew deprecated `postflight` in favour of `postflight_steps`, and the
    # GoReleaser option that emits the new stanza (hooks.post.install_steps)
    # is only in the unreleased v2.19. Until then the stanza is injected via
    # custom_block. The braces are escaped so GoReleaser's own templating
    # passes them through to Homebrew untouched.
    custom_block: |
      postflight_steps do
        on_macos do
          run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{" }}staged_path{{ "}}" }}/speedprobe"]
        end
      end
    commit_author:
      name: goreleaser-bot
      email: bot@goreleaser.com

release:
  github:
    owner: akshtray
    name: speedprobe
  prerelease: auto
  # Lets a re-run of the release job (e.g. after fixing the tap token)
  # re-upload identical artifacts instead of failing on "already exists".
  replace_existing_artifacts: true
  footer: |
    **Install:** `brew install akshtray/tap/speedprobe`, the `.deb`/`.rpm` below, or `go install github.com/akshtray/speedprobe/cmd/speedprobe@{{ .Tag }}`.
    The same files are always available for the newest release under `https://github.com/akshtray/speedprobe/releases/latest/download/`.
    Already installed? `speedprobe version --check` tells you whether this is newer and how to upgrade.
    The `checksums.txt` file is signed with Sigstore cosign (keyless); see the README for how to verify.

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  groups:
    - title: Features
      regexp: '^feat'
      order: 0
    - title: Fixes
      regexp: '^fix'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude: ["^chore", "^ci", "^docs", "^test"]
