[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "speedprobe"
version = "0.1.0"
description = "Multi-provider internet speed test CLI (Cloudflare, Fast.com, M-Lab ndt7, Ookla, TestMy.net)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["aiohttp>=3.9", "rich>=13"]

[project.scripts]
speedprobe = "speedprobe:main"

[tool.setuptools]
py-modules = ["speedprobe"]
